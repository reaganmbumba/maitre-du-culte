name: Construire l'APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Construire l'APK
        working-directory: android/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: maitre-du-culte-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publier l'APK (lien de téléchargement permanent)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk maitre-du-culte.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk maitre-du-culte.apk --target "$GITHUB_SHA" --latest \
            --title "Maître du Culte · Android" \
            --notes "Application Android du maître du culte. Téléchargez maitre-du-culte.apk et installez-le sur le téléphone."
